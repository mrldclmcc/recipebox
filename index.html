<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recipe Box</title>
<meta name="description" content="A personal recipe collection — browse, search, and cook." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface-alt: #f1ede5;
  --surface-hover: #ece6dc;
  --border: #e4ddd1;
  --border-strong: #d6cdbd;
  --text: #221d16;
  --text-muted: #6f6657;
  --text-faint: #9c9384;
  --accent: #b8501f;
  --accent-strong: #973f15;
  --accent-soft: rgba(184, 80, 31, 0.11);
  --accent-soft-strong: rgba(184, 80, 31, 0.22);
  --accent-on: #ffffff;
  --shadow-sm: 0 1px 2px rgba(40, 30, 15, 0.06);
  --shadow-md: 0 6px 20px -4px rgba(40, 30, 15, 0.14), 0 2px 6px -2px rgba(40,30,15,0.08);
  --shadow-lg: 0 20px 50px -12px rgba(40, 30, 15, 0.28);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

html[data-theme="dark"]{
  --bg: #1a1713;
  --surface: #221e18;
  --surface-alt: #2b2620;
  --surface-hover: #332d24;
  --border: #3a3327;
  --border-strong: #4a4233;
  --text: #f0ebe2;
  --text-muted: #b3a896;
  --text-faint: #7f7665;
  --accent: #e08348;
  --accent-strong: #ef9c63;
  --accent-soft: rgba(224, 131, 72, 0.16);
  --accent-soft-strong: rgba(224, 131, 72, 0.30);
  --accent-on: #1a1713;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 6px 24px -4px rgba(0,0,0,0.5), 0 2px 6px -2px rgba(0,0,0,0.4);
  --shadow-lg: 0 24px 60px -12px rgba(0,0,0,0.6);
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s var(--ease), color 0.25s var(--ease);
}
img,svg{ display:block; max-width:100%; }
button{ font-family: inherit; }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a{ color: var(--accent); text-decoration:none; }

.icon{ width:18px; height:18px; flex-shrink:0; stroke: currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{ min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  position: sticky; top:0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--border);
}
.topbar-inner{
  max-width: 1180px; margin:0 auto; padding: 14px 24px;
  display:flex; align-items:center; gap:16px;
}
.brand{
  display:flex; align-items:center; gap:9px;
  font-family: var(--font-serif); font-weight:600; font-size:1.18rem; letter-spacing: -0.01em;
  color: var(--text); white-space:nowrap; flex-shrink:0;
  cursor:pointer; border:none; background:none; padding:0;
}
.brand .icon{ width:22px; height:22px; color: var(--accent); }

.searchwrap{ position:relative; flex:1; min-width:0; max-width: 560px; }
.searchwrap .icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color: var(--text-faint); pointer-events:none; }
#searchInput{
  width:100%; padding: 10px 14px 10px 40px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 0.92rem; transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
}
#searchInput::placeholder{ color: var(--text-faint); }
#searchInput:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline:none; }
.clear-search{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%; border:none; background:transparent;
  color: var(--text-faint); cursor:pointer; display:none; align-items:center; justify-content:center;
}
.clear-search:hover{ background: var(--surface-alt); color: var(--text); }
.clear-search.show{ display:flex; }

.topbar-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.iconbtn{
  width:38px; height:38px; border-radius: var(--radius-md); border:1px solid transparent;
  background:transparent; color: var(--text-muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.iconbtn:hover{ background: var(--surface-alt); color: var(--text); }
.iconbtn.active{ color: var(--accent); background: var(--accent-soft); }
.theme-toggle .icon-moon{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-moon{ display:flex; }

.main{ flex:1; max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; width:100%; }

/* ============================================================
   BROWSE PANEL
   ============================================================ */
.browse-panel{ margin-bottom: 30px; }
.browse-row{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
  scrollbar-width:none;
}
.browse-row::-webkit-scrollbar{ display:none; }
.facet-btn{
  flex-shrink:0; display:flex; align-items:center; gap:7px;
  padding: 9px 15px; border-radius: 999px; border:1px solid var(--border);
  background: var(--surface); color: var(--text); font-size:0.86rem; font-weight:500;
  cursor:pointer; transition: all .16s var(--ease); white-space:nowrap;
}
.facet-btn .count{ color: var(--text-faint); font-size:0.8em; }
.facet-btn:hover{ border-color: var(--border-strong); background: var(--surface-hover); }
.facet-btn.open{ background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.facet-btn.open .count{ color: color-mix(in srgb, var(--accent-on) 70%, transparent); }

.facet-values{
  display:flex; flex-wrap:wrap; gap:8px; margin-top: 14px;
  max-height:0; overflow:hidden; opacity:0;
  transition: max-height .28s var(--ease), opacity .2s var(--ease), margin-top .28s var(--ease);
}
.facet-values.expanded{ max-height: 600px; opacity:1; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding: 7px 13px; border-radius:999px; border:1px solid var(--border);
  background: var(--surface-alt); color: var(--text); font-size:0.83rem; cursor:pointer;
  transition: all .14s var(--ease);
}
.chip:hover{ border-color: var(--border-strong); }
.chip .count{ color: var(--text-faint); }
.chip.selected{ background: var(--accent-soft-strong); border-color: var(--accent); color: var(--accent-strong); font-weight:600; }
.chip.selected .count{ color: var(--accent-strong); opacity:.75; }

.active-filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
.active-filters.empty{ display:none; }
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:6px 8px 6px 12px;
  border-radius:999px; background: var(--accent); color: var(--accent-on); font-size:0.8rem; font-weight:600;
}
.pill button{ background:none; border:none; color:inherit; cursor:pointer; display:flex; align-items:center; opacity:.8; padding:2px; border-radius:50%; }
.pill button:hover{ opacity:1; background: rgba(0,0,0,0.15); }
.clear-all-link{ font-size:0.82rem; color: var(--text-muted); background:none; border:none; cursor:pointer; text-decoration:underline; text-decoration-color: var(--border-strong); padding:6px 2px; }
.clear-all-link:hover{ color: var(--accent); }

/* ============================================================
   RECENTLY VIEWED
   ============================================================ */
.recent-strip{ margin-bottom: 30px; }
.recent-strip h2{ font-size:0.78rem; }
.recent-row{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
.recent-row::-webkit-scrollbar{ display:none; }
.recent-card{
  flex-shrink:0; width:178px; padding:12px 14px; border-radius: var(--radius-md);
  background: var(--surface); border:1px solid var(--border); cursor:pointer;
  transition: border-color .15s var(--ease), transform .15s var(--ease);
}
.recent-card:hover{ border-color: var(--border-strong); transform: translateY(-1px); }
.recent-card .t{ font-family: var(--font-serif); font-size:0.92rem; font-weight:600; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* ============================================================
   SECTION LABELS
   ============================================================ */
.eyebrow{
  font-family: var(--font-sans); font-size:0.74rem; font-weight:700; letter-spacing:0.09em;
  text-transform:uppercase; color: var(--text-faint); margin: 0 0 12px;
}

/* ============================================================
   RESULTS HEADER + GRID
   ============================================================ */
.results-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
.results-count{ font-size:0.86rem; color: var(--text-muted); }
.sort-select{
  font-size:0.83rem; color: var(--text-muted); background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-sm); padding:6px 10px; cursor:pointer;
}

.grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap:18px;
}

.card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px 18px 16px; cursor:pointer; text-align:left; position:relative;
  display:flex; flex-direction:column; gap:10px;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
  animation: cardIn .35s var(--ease) backwards;
}
@keyframes cardIn{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:none; } }
.card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.card-top{ display:flex; justify-content:space-between; gap:10px; }
.card-title{ font-family: var(--font-serif); font-size:1.12rem; font-weight:600; line-height:1.28; color:var(--text); }
.fav-btn{
  flex-shrink:0; width:30px; height:30px; border-radius:50%; border:none; background:transparent;
  color: var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition: color .15s, background .15s, transform .15s var(--ease);
}
.fav-btn:hover{ background: var(--surface-alt); color: var(--accent); }
.fav-btn.active{ color: var(--accent); }
.fav-btn.active .icon{ fill: currentColor; }
.fav-btn.bump .icon{ animation: favBump .4s var(--ease); }
@keyframes favBump{ 0%{transform:scale(1);} 35%{transform:scale(1.35);} 100%{transform:scale(1);} }

.card-source{ font-size:0.8rem; color: var(--text-muted); }
.card-source .book{ font-style:italic; }
.card-meta{ display:flex; gap:12px; font-size:0.78rem; color: var(--text-faint); flex-wrap:wrap; }
.card-meta span{ display:flex; align-items:center; gap:4px; }
.card-meta .icon{ width:14px; height:14px; }
.card-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:4px; }
.tagchip{ font-size:0.72rem; padding:3px 9px; border-radius:999px; background: var(--surface-alt); color: var(--text-muted); }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state{ text-align:center; padding: 70px 20px; color: var(--text-muted); }
.empty-state .icon{ width:38px; height:38px; margin: 0 auto 16px; color: var(--text-faint); }
.empty-state h3{ font-family: var(--font-serif); font-size:1.3rem; color: var(--text); margin:0 0 6px; }
.empty-state p{ margin:0 0 18px; font-size:0.92rem; }
.empty-state button{
  font-size:0.86rem; font-weight:600; color: var(--accent-on); background: var(--accent);
  border:none; padding:9px 18px; border-radius: var(--radius-md); cursor:pointer;
}

/* ============================================================
   RECIPE DETAIL VIEW
   ============================================================ */
.detail-view{ display:none; }
.detail-view.show{ display:block; animation: viewIn .3s var(--ease); }
@keyframes viewIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:none; } }
.browse-view.hide, .home-extras.hide{ display:none; }

.back-btn{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  color: var(--text-muted); font-size:0.86rem; font-weight:600; padding:8px 0; margin-bottom: 18px;
  transition: color .15s var(--ease);
}
.back-btn:hover{ color: var(--accent); }

.detail-head{ display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom: 18px; }
.detail-title{ font-family: var(--font-serif); font-size: 2.05rem; font-weight:600; line-height:1.14; letter-spacing:-0.01em; margin:0; }
.detail-source{ margin-top:8px; font-size:0.95rem; color: var(--text-muted); }
.detail-source .book{ font-style:italic; color: var(--text); }
.fav-btn-lg{
  flex-shrink:0; width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
  background: var(--surface); color: var(--text-faint); cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition: all .15s var(--ease);
}
.fav-btn-lg:hover{ border-color: var(--accent); color: var(--accent); }
.fav-btn-lg.active{ color: var(--accent-on); background: var(--accent); border-color: var(--accent); }
.fav-btn-lg.active .icon{ fill:currentColor; }
.fav-btn-lg.bump .icon{ animation: favBump .4s var(--ease); }

.detail-meta-row{ display:flex; gap:18px; flex-wrap:wrap; margin: 16px 0 6px; font-size:0.86rem; color: var(--text-muted); }
.detail-meta-row span{ display:flex; align-items:center; gap:6px; }
.detail-meta-row .icon{ color: var(--text-faint); }
.stars{ color: var(--accent); letter-spacing:1px; }

.detail-tags{ display:flex; flex-wrap:wrap; gap:7px; margin: 14px 0 0; }

.detail-body{ display:grid; grid-template-columns: minmax(240px, 320px) 1fr; gap:48px; margin-top:34px; align-items:start; }
@media (max-width: 860px){ .detail-body{ grid-template-columns: 1fr; gap:34px; } }

.ing-col{ position:sticky; top:88px; }
@media (max-width:860px){ .ing-col{ position:static; } }
.ing-group{ margin-bottom:20px; }
.ing-group:last-child{ margin-bottom:0; }
.ing-group-label{ font-size:0.76rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color: var(--text-faint); margin-bottom:8px; }
.ing-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; }
.ing-row{
  display:flex; gap:10px; padding:9px 10px; border-radius: var(--radius-sm); cursor:default;
  transition: background .15s var(--ease);
  font-size:0.92rem; line-height:1.45;
}
.ing-row.linked{ cursor:pointer; }
.ing-row.linked:hover, .ing-row.active{ background: var(--accent-soft); }
.ing-amt{ flex-shrink:0; min-width:64px; text-align:right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.ing-name{ color: var(--text); }
.ing-note{ color: var(--text-faint); font-size:0.88em; }

.steps-col{ font-family: var(--font-serif); }
.step{ display:flex; gap:16px; margin-bottom:26px; }
.step:last-child{ margin-bottom:0; }
.step-num{
  flex-shrink:0; width:30px; height:30px; border-radius:50%; background: var(--surface-alt);
  color: var(--text-muted); font-family: var(--font-sans); font-weight:700; font-size:0.82rem;
  display:flex; align-items:center; justify-content:center; margin-top:3px;
}
.step-text{ font-size:1.06rem; line-height:1.7; color: var(--text); }
.ing-hl{
  background: var(--accent-soft); border-bottom: 1.5px solid var(--accent); color: var(--text);
  border-radius:3px; padding: 0 2px; cursor:pointer; transition: background .15s var(--ease);
}
.ing-hl.active{ background: var(--accent-soft-strong); }

.detail-footer{ margin-top:44px; padding-top:28px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:22px; }
.equip-list{ display:flex; flex-wrap:wrap; gap:8px; }
.equip-chip{ display:flex; align-items:center; gap:6px; font-size:0.82rem; padding:6px 12px; border-radius:999px; background: var(--surface-alt); color: var(--text-muted); }
.notes-block{ font-size:0.92rem; color: var(--text-muted); line-height:1.6; max-width:640px; }
.notes-block strong{ color: var(--text); }

/* ============================================================
   MISC
   ============================================================ */
.section{ margin-bottom:36px; }
footer.sitefoot{ text-align:center; padding: 26px 0 40px; font-size:0.78rem; color: var(--text-faint); }

@media (max-width: 640px){
  .topbar-inner{ padding: 12px 16px; gap:10px; }
  .brand span.label{ display:none; }
  .main{ padding: 20px 16px 60px; }
  .detail-title{ font-size:1.6rem; }
  .grid{ grid-template-columns: 1fr 1fr; gap:12px; }
  .card{ padding:14px; }
}
@media (max-width: 420px){
  .grid{ grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="logoBtn" aria-label="Recipe Box home">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v15"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21h12A1.5 1.5 0 0 0 19 19.5"/><path d="M9 7h6M9 11h6"/></svg>
        <span class="label">Recipe&nbsp;Box</span>
      </button>
      <div class="searchwrap">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search recipes, ingredients, books…" autocomplete="off" />
        <button class="clear-search" id="clearSearch" aria-label="Clear search">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="topbar-actions">
        <button class="iconbtn" id="favToggleBtn" aria-label="Show favorites" title="Favorites">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.35-9.5-8.5C.7 8 2 4.5 5.5 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 4.8 3.5 3 7C19 15.65 12 20 12 20Z"/></svg>
        </button>
        <button class="iconbtn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" style="display:flex"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ============ BROWSE / HOME VIEW ============ -->
    <div id="browseView" class="browse-view">

      <div id="recentSection" class="recent-strip section" style="display:none;">
        <h2 class="eyebrow">Recently viewed</h2>
        <div class="recent-row" id="recentRow"></div>
      </div>

      <div class="browse-panel section">
        <h2 class="eyebrow">Browse by</h2>
        <div class="browse-row" id="facetButtons"></div>
        <div class="facet-values" id="facetValues"></div>
        <div class="active-filters empty" id="activeFilters"></div>
      </div>

      <div class="section">
        <div class="results-header">
          <div class="results-count" id="resultsCount"></div>
          <select class="sort-select" id="sortSelect">
            <option value="title">Sort: Title A–Z</option>
            <option value="recent">Sort: Recently added</option>
          </select>
        </div>
        <div class="grid" id="resultsGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <h3>No recipes match</h3>
          <p>Try removing a filter or searching for something else.</p>
          <button id="clearAllBtn">Clear filters</button>
        </div>
      </div>

    </div>

    <!-- ============ RECIPE DETAIL VIEW ============ -->
    <div id="detailView" class="detail-view"></div>

  </main>

  <footer class="sitefoot">Your recipe box — growing one cookbook at a time.</footer>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS & ICONS
   ============================================================ */
const LS_KEYS = {
  favorites: 'recipeBox.favorites',
  recent: 'recipeBox.recentlyViewed',
  theme: 'recipeBox.theme'
};
const PLACEHOLDER_VALUES = new Set(['any', 'none', 'n/a', 'na']);
const SMALL_WORDS = new Set(['a','an','the','of','in','on','at','by','to','for','and','or','nor','with','from','as','but']);

const FACET_DEFS = [
  { key:'meal',    label:'Meal',     getValues:r => r.facets?.meal || [] },
  { key:'protein', label:'Protein',  getValues:r => r.facets?.protein || [] },
  { key:'method',  label:'Method',   getValues:r => r.facets?.method || [] },
  { key:'dietary', label:'Dietary',  getValues:r => r.facets?.dietary || [] },
  { key:'season',  label:'Season',   getValues:r => r.facets?.season || [] },
  { key:'tag',     label:'Tag',      getValues:r => r.tags || [] },
  { key:'book',    label:'Cookbook', getValues:r => r.source?.book ? [r.source.book] : [] },
  { key:'author',  label:'Author',   getValues:r => r.source?.author ? [r.source.author] : [] },
];

const ICONS = {
  clock: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  servings: '<svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-2a6 6 0 0 1 6-6h0a6 6 0 0 1 6 6v2"/><path d="M16 3.2a3 3 0 0 1 0 5.8M21 21v-2a5.5 5.5 0 0 0-3.5-5.1"/></svg>',
  star: '★',

  back: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  heart: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 20s-7-4.35-9.5-8.5C.7 8 2 4.5 5.5 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 4.8 3.5 3 7C19 15.65 12 20 12 20Z"/></svg>',
  equip: '<svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 3v6a3 3 0 0 0 3 3v9M6 3v6M9 9V3M17 3v18M14 7h6"/></svg>'

/* ============================================================
   STATE
   ============================================================ */
let RECIPES = [];          // normalized recipes
let fuse = null;
let state = {
  query: '',
  openFacet: null,                 // which facet category is expanded
  activeValues: {},                // { facetKey: Set(values) }
  showFavoritesOnly: false,
  sort: 'title',
  view: 'browse',                  // 'browse' | 'detail'
  detailId: null,
  activeIngredientId: null
};

/* ============================================================
   UTILITIES — title case, fractions, slugs
   ============================================================ */
function isShouty(word){
  const letters = word.replace(/[^a-zA-Z]/g, '');
  return letters.length > 1 && letters === letters.toUpperCase();
}
function capPart(part){
  if(!part) return part;
  let result = '';
  let capped = false;
  for(const ch of part){
    if(/[a-zA-Z]/.test(ch)){
      result += capped ? ch.toLowerCase() : ch.toUpperCase();
      capped = true;
    } else {
      result += ch;
    }
  }
  return result;
}
function titleCaseWord(word, index, total){
  // Preserve punctuation, split on hyphens, respect small-word lowercasing
  const core = word.replace(/^[^a-zA-Z]*|[^a-zA-Z]*$/g, '');
  if(!core) return word;
  const lower = core.toLowerCase();
  const isSmall = SMALL_WORDS.has(lower) && index !== 0 && index !== total - 1;
  const transformed = word.split('-').map(capPart).join('-');
  if(isSmall){
    return word.toLowerCase();
  }
  return transformed;
}
function normalizeTitle(title){
  if(!title) return 'Untitled recipe';
  const words = title.split(' ');
  const total = words.length;
  return words.map((w,i) => isShouty(w) ? titleCaseWord(w,i,total) : w).join(' ');
}
function humanize(slug){
  if(!slug) return '';
  return slug.replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().split(' ')
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
const FRACTIONS = [
  [0.125,'⅛'],[0.25,'¼'],[0.333,'⅓'],[0.34,'⅓'],[0.375,'⅜'],[0.5,'½'],
  [0.625,'⅝'],[0.66,'⅔'],[0.667,'⅔'],[0.75,'¾'],[0.875,'⅞']
];
function formatAmount(amount){
  if(amount === null || amount === undefined || amount === '') return '';
  if(typeof amount !== 'number') return String(amount);
  const whole = Math.floor(amount);
  const frac = +(amount - whole).toFixed(3);
  if(frac === 0) return String(whole);
  for(const [val,glyph] of FRACTIONS){
    if(Math.abs(frac - val) < 0.02){
      return whole > 0 ? `${whole}${glyph}` : glyph;
    }
  }
  // fall back to a clean decimal
  const rounded = Math.round(amount * 100) / 100;
  return String(rounded);
}
function formatServings(s){
  if(s === null || s === undefined || s === '') return null;
  if(typeof s === 'number') return `Serves ${s}`;
  return /^\d/.test(s) || /serv|loaf|loaves|dozen/i.test(s) ? (/^makes|^serv/i.test(s) ? s : `Makes ${s}`) : s;
}
function formatTime(mins){
  if(!mins) return null;
  if(mins < 60) return `${mins} min`;
  const h = Math.floor(mins/60), m = mins % 60;
  return m ? `${h} hr ${m} min` : `${h} hr`;
}
function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ============================================================
   NORMALIZATION
   ============================================================ */
function normalizeRecipe(raw){
  const r = JSON.parse(JSON.stringify(raw));
  r._title = normalizeTitle(r.title);
  r._servingsLabel = formatServings(r.servings);
  r._totalTime = formatTime(r.time?.total_minutes);
  r._prepTime = formatTime(r.time?.prep_minutes);
  r._cookTime = formatTime(r.time?.cook_minutes);

  // group ingredients by "for the X" suffix in notes
  const groups = [];
  const groupIndex = {};
  (r.ingredients || []).forEach((ing, idx) => {
    let groupLabel = null;
    let cleanNote = ing.notes;
    if(ing.notes){
      const m = ing.notes.match(/;?\s*for the ([a-zA-Z ]+?)\s*$/i);
      if(m){
        groupLabel = humanize(m[1].trim());
        cleanNote = ing.notes.replace(/;?\s*for the [a-zA-Z ]+?\s*$/i, '').trim();
        if(cleanNote === '') cleanNote = null;
      }
    }
    const key = groupLabel || '__default__';
    if(!(key in groupIndex)){
      groupIndex[key] = groups.length;
      groups.push({ label: groupLabel, items: [] });
    }
    const ingId = `ing-${r.id}-${idx}`;
    groups[groupIndex[key]].items.push({
      id: ingId,
      name: ing.name,
      amount: ing.amount,
      unit: ing.unit,
      note: cleanNote,
      amountLabel: formatAmount(ing.amount),
    });
  });
  r._ingredientGroups = groups;
  r._flatIngredients = groups.flatMap(g => g.items);

  // equipment, display labels
  r._equipmentLabels = (r.equipment || []).map(e => ({ raw:e, label: humanize(e) }));

  // combined display tags (facets + tags), deduped, placeholders removed
  const tagSet = new Set();
  FACET_DEFS.forEach(def => {
    if(def.key === 'book' || def.key === 'author') return;
    def.getValues(r).forEach(v => { if(v && !PLACEHOLDER_VALUES.has(String(v).toLowerCase())) tagSet.add(v); });
  });
  r._displayTags = [...tagSet];

  r._searchBlob = [
    r._title, r.source?.book, r.source?.author, r.notes,
    ...(r.tags||[]), ...(r.ingredients||[]).map(i=>i.name)
  ].filter(Boolean).join(' ');

  return r;
}

/* ============================================================
   STEP / INGREDIENT HIGHLIGHTING
   ============================================================ */
function buildStepHighlights(recipe){
  const candidates = recipe._flatIngredients
    .map(ing => {
      let name = ing.name.toLowerCase().replace(/\(.*?\)/g, '').trim();
      return { id: ing.id, name };
    })
    .filter(c => c.name.length > 2);

  return recipe.steps.map(stepText => {
    let html = escapeHtml(stepText);

    const patterns = [];
    candidates.forEach(c => {
      const words = c.name.split(/\s+/).filter(Boolean);
      const lastWord = words[words.length-1];
      patterns.push({ id:c.id, term:c.name });
      if(words.length > 1 && lastWord.length > 3){
        patterns.push({ id:c.id, term:lastWord });
      }
    });
    const seenTerm = new Set();
    const uniquePatterns = [];
    patterns.forEach(p => {
      const k = p.term.toLowerCase();
      if(!seenTerm.has(k)){ seenTerm.add(k); uniquePatterns.push(p); }
    });
    uniquePatterns.sort((a,b) => b.term.length - a.term.length);

    uniquePatterns.forEach(p => {
      const escTerm = escapeRegex(p.term);
      const re = new RegExp(`\\b(${escTerm}s?)\\b`, 'gi');
      html = html.replace(re, (match, grp, offset, full) => {
        const before = full.slice(Math.max(0, offset-40), offset);
        if(/<[^>]*$/.test(before)) return match;
        return `<span class="ing-hl" data-ing="${p.id}">${match}</span>`;
      });
    });
    html = html.replace(/(<span class="ing-hl"[^>]*>)((?:(?!<\/span>).)*?)(<span class="ing-hl"[^>]*>)/g, '$1$2');
    return html;
  });
}

/* ============================================================
   LOCAL STORAGE HELPERS
   ============================================================ */
function loadSet(key){
  try{ return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }catch(e){ return new Set(); }
}
function saveSet(key, set){
  try{ localStorage.setItem(key, JSON.stringify([...set])); }catch(e){}
}
let favorites = loadSet(LS_KEYS.favorites);
let recentlyViewed = (()=>{ try{ return JSON.parse(localStorage.getItem(LS_KEYS.recent)||'[]'); }catch(e){ return []; } })();

function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
  saveSet(LS_KEYS.favorites, favorites);
}
function pushRecent(id){
  recentlyViewed = [id, ...recentlyViewed.filter(x => x !== id)].slice(0, 8);
  try{ localStorage.setItem(LS_KEYS.recent, JSON.stringify(recentlyViewed)); }catch(e){}
}

/* ============================================================
   THEME
   ============================================================ */
function initTheme(){
  const saved = localStorage.getItem(LS_KEYS.theme);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(LS_KEYS.theme, next); }catch(e){}
}

/* ============================================================
   FACET COUNTS / FILTERING
   ============================================================ */
function getFacetValueCounts(def){
  const counts = new Map();
  RECIPES.forEach(r => {
    def.getValues(r).forEach(v => {
      if(!v || PLACEHOLDER_VALUES.has(String(v).toLowerCase())) return;
      counts.set(v, (counts.get(v)||0) + 1);
    });
  });
  return [...counts.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}

function matchesActiveFilters(recipe){
  const keys = Object.keys(state.activeValues).filter(k => state.activeValues[k].size > 0);
  if(keys.length === 0) return true;
  return keys.every(key => {
    const def = FACET_DEFS.find(d => d.key === key);
    const vals = new Set(def.getValues(recipe));
    const active = state.activeValues[key];
    for(const v of active){ if(vals.has(v)) return true; }
    return false;
  });
}

function getFilteredSortedRecipes(){
  let list;
  if(state.query.trim()){
    const results = fuse ? fuse.search(state.query.trim()) : [];
    list = results.map(r => r.item);
  } else {
    list = RECIPES.slice();
  }
  list = list.filter(matchesActiveFilters);
  if(state.showFavoritesOnly) list = list.filter(r => favorites.has(r.id));

  if(!state.query.trim()){
    if(state.sort === 'title') list.sort((a,b) => a._title.localeCompare(b._title));
    else if(state.sort === 'recent') list.sort((a,b) => (b.date_added||'').localeCompare(a.date_added||''));
  }
  return list;
}

/* ============================================================
   RENDER: BROWSE BUTTONS + VALUES
   ============================================================ */
function renderFacetButtons(){
  const wrap = document.getElementById('facetButtons');
  wrap.innerHTML = FACET_DEFS.map(def => {
    const count = getFacetValueCounts(def).length;
    if(count === 0) return '';
    const isOpen = state.openFacet === def.key;
    return `<button class="facet-btn ${isOpen?'open':''}" data-facet="${def.key}">${def.label} <span class="count">${count}</span></button>`;
  }).join('');
  wrap.querySelectorAll('.facet-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.openFacet = state.openFacet === btn.dataset.facet ? null : btn.dataset.facet;
      renderFacetButtons();
      renderFacetValues();
    });
  });
}

function renderFacetValues(){
  const wrap = document.getElementById('facetValues');
  if(!state.openFacet){ wrap.classList.remove('expanded'); wrap.innerHTML=''; return; }
  const def = FACET_DEFS.find(d => d.key === state.openFacet);
  const entries = getFacetValueCounts(def);
  const active = state.activeValues[def.key] || new Set();
  wrap.innerHTML = entries.map(([val,count]) => {
    const sel = active.has(val);
    return `<button class="chip ${sel?'selected':''}" data-key="${def.key}" data-val="${escapeHtml(val)}">${escapeHtml(humanize(val))} <span class="count">${count}</span></button>`;
  }).join('');
  requestAnimationFrame(() => wrap.classList.add('expanded'));
  wrap.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.key, val = chip.dataset.val;
      if(!state.activeValues[key]) state.activeValues[key] = new Set();
      if(state.activeValues[key].has(val)) state.activeValues[key].delete(val);
      else state.activeValues[key].add(val);
      renderFacetValues();
      renderActiveFilters();
      renderResults();
    });
  });
}

function renderActiveFilters(){
  const wrap = document.getElementById('activeFilters');
  const pills = [];
  Object.entries(state.activeValues).forEach(([key, set]) => {
    set.forEach(val => pills.push({key, val}));
  });
  if(state.showFavoritesOnly) pills.push({key:'__fav__', val:'Favorites'});
  if(pills.length === 0){ wrap.classList.add('empty'); wrap.innerHTML=''; return; }
  wrap.classList.remove('empty');
  wrap.innerHTML = pills.map(p => `
    <span class="pill" data-key="${p.key}" data-val="${escapeHtml(p.val)}">
      ${escapeHtml(p.key === '__fav__' ? 'Favorites' : humanize(p.val))}
      <button aria-label="Remove filter">
        <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </span>`).join('') + `<button class="clear-all-link" id="clearAllInline">Clear all</button>`;
  wrap.querySelectorAll('.pill button').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.closest('.pill');
      const key = p.dataset.key, val = p.dataset.val;
      if(key === '__fav__'){ state.showFavoritesOnly = false; }
      else { state.activeValues[key]?.delete(val); }
      renderFacetValues();
      renderActiveFilters();
      renderResults();
      renderFavToggleBtn();
    });
  });
  document.getElementById('clearAllInline')?.addEventListener('click', clearAllFilters);
}

function clearAllFilters(){
  state.activeValues = {};
  state.showFavoritesOnly = false;
  state.query = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').classList.remove('show');
  renderFacetValues();
  renderActiveFilters();
  renderFavToggleBtn();
  renderResults();
}

/* ============================================================
   RENDER: RECENTLY VIEWED
   ============================================================ */
function renderRecent(){
  const section = document.getElementById('recentSection');
  const row = document.getElementById('recentRow');
  const items = recentlyViewed.map(id => RECIPES.find(r => r.id === id)).filter(Boolean);
  if(items.length === 0 || state.view !== 'browse'){ section.style.display='none'; return; }
  section.style.display='';
  row.innerHTML = items.map(r => `<div class="recent-card" data-id="${r.id}"><div class="t">${escapeHtml(r._title)}</div></div>`).join('');
  row.querySelectorAll('.recent-card').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
}

/* ============================================================
   RENDER: RESULTS GRID
   ============================================================ */
function recipeCardHtml(r){
  const isFav = favorites.has(r.id);
  const metaBits = [];
  if(r._servingsLabel) metaBits.push(`<span>${ICONS.servings}${escapeHtml(r._servingsLabel)}</span>`);
  if(r._totalTime) metaBits.push(`<span>${ICONS.clock}${escapeHtml(r._totalTime)}</span>`);
  const tags = r._displayTags.slice(0,3);
  return `
  <article class="card" data-id="${r.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(r._title)}">
    <div class="card-top">
      <div class="card-title">${escapeHtml(r._title)}</div>
      <button class="fav-btn ${isFav?'active':''}" data-id="${r.id}" aria-label="${isFav?'Remove from favorites':'Add to favorites'}">${ICONS.heart}</button>
    </div>
    ${r.source?.book ? `<div class="card-source"><span class="book">${escapeHtml(r.source.book)}</span>${r.source.author?` · ${escapeHtml(r.source.author)}`:''}</div>` : ''}
    ${metaBits.length ? `<div class="card-meta">${metaBits.join('')}</div>` : ''}
    ${tags.length ? `<div class="card-tags">${tags.map(t=>`<span class="tagchip">${escapeHtml(humanize(t))}</span>`).join('')}</div>` : ''}
  </article>`;
}

function renderResults(){
  const list = getFilteredSortedRecipes();
  const grid = document.getElementById('resultsGrid');
  const empty = document.getElementById('emptyState');
  const countEl = document.getElementById('resultsCount');
  countEl.textContent = `${list.length} recipe${list.length===1?'':'s'}`;
  if(list.length === 0){
    grid.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = list.map(recipeCardHtml).join('');
    grid.querySelectorAll('.card').forEach((el,i) => {
      el.style.animationDelay = `${Math.min(i*25,250)}ms`;
      el.addEventListener('click', (e) => { if(e.target.closest('.fav-btn')) return; openDetail(el.dataset.id); });
      el.addEventListener('keydown', (e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDetail(el.dataset.id); } });
    });
    grid.querySelectorAll('.fav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorite(btn.dataset.id);
        btn.classList.toggle('active');
        btn.classList.add('bump');
        setTimeout(()=>btn.classList.remove('bump'), 400);
        if(state.showFavoritesOnly) renderResults();
      });
    });
  }
  document.getElementById('clearAllBtn')?.addEventListener('click', clearAllFilters);
}

function renderFavToggleBtn(){
  document.getElementById('favToggleBtn').classList.toggle('active', state.showFavoritesOnly);
}

/* ============================================================
   RENDER: DETAIL VIEW
   ============================================================ */
function openDetail(id){
  state.view = 'detail';
  state.detailId = id;
  pushRecent(id);
  location.hash = `recipe/${id}`;
  renderDetail();
  document.getElementById('browseView').classList.add('hide');
  document.getElementById('detailView').classList.add('show');
  window.scrollTo(0,0);
}
function closeDetail(){
  state.view = 'browse';
  state.detailId = null;
  history.replaceState ? history.replaceState(null,'',location.pathname+location.search) : (location.hash = '');
  document.getElementById('browseView').classList.remove('hide');
  document.getElementById('detailView').classList.remove('show');
  renderRecent();
}

function renderDetail(){
  const r = RECIPES.find(x => x.id === state.detailId);
  const container = document.getElementById('detailView');
  if(!r){ container.innerHTML = `<p>Recipe not found.</p>`; return; }

  const isFav = favorites.has(r.id);
  const metaBits = [];
  if(r._servingsLabel) metaBits.push(`<span>${ICONS.servings}${escapeHtml(r._servingsLabel)}</span>`);
  if(r._totalTime) metaBits.push(`<span>${ICONS.clock}Total ${escapeHtml(r._totalTime)}</span>`);
  if(r._prepTime) metaBits.push(`<span>Prep ${escapeHtml(r._prepTime)}</span>`);
  if(r._cookTime) metaBits.push(`<span>Cook ${escapeHtml(r._cookTime)}</span>`);
  if(r.rating){ metaBits.push(`<span class="stars">${ICONS.star.repeat(r.rating)}${ICONS.starEmpty.repeat(Math.max(0,5-r.rating))}</span>`); }

  const ingGroupsHtml = r._ingredientGroups.map(g => `
    <div class="ing-group">
      ${g.label ? `<div class="ing-group-label">${escapeHtml(g.label)}</div>` : ''}
      <ul class="ing-list">
        ${g.items.map(it => `
          <li class="ing-row linked" data-ing="${it.id}">
            <span class="ing-amt">${escapeHtml([it.amountLabel, it.unit].filter(Boolean).join(' '))}</span>
            <span><span class="ing-name">${escapeHtml(it.name)}</span>${it.note?` <span class="ing-note">— ${escapeHtml(it.note)}</span>`:''}</span>
          </li>`).join('')}
      </ul>
    </div>`).join('');

  const highlightedSteps = buildStepHighlights(r);
  const stepsHtml = highlightedSteps.map((html,i) => `
    <div class="step">
      <div class="step-num">${i+1}</div>
      <div class="step-text">${html}</div>
    </div>`).join('');

  const equipHtml = r._equipmentLabels.length ? `
    <div>
      <div class="eyebrow">Equipment</div>
      <div class="equip-list">${r._equipmentLabels.map(e => `<span class="equip-chip">${escapeHtml(e.label)}</span>`).join('')}</div>
    </div>` : '';

  const notesHtml = r.notes ? `
    <div class="notes-block"><strong>Notes — </strong>${escapeHtml(r.notes)}</div>` : '';

  container.innerHTML = `
    <button class="back-btn" id="backBtn">${ICONS.back} Back to recipes</button>
    <div class="detail-head">
      <div>
        <h1 class="detail-title">${escapeHtml(r._title)}</h1>
        ${r.source?.book ? `<div class="detail-source"><span class="book">${escapeHtml(r.source.book)}</span>${r.source.author?` · ${escapeHtml(r.source.author)}`:''}</div>` : ''}
      </div>
      <button class="fav-btn-lg ${isFav?'active':''}" id="detailFavBtn" aria-label="${isFav?'Remove from favorites':'Add to favorites'}">${ICONS.heart}</button>
    </div>
    ${metaBits.length ? `<div class="detail-meta-row">${metaBits.join('')}</div>` : ''}
    ${r._displayTags.length ? `<div class="detail-tags">${r._displayTags.map(t=>`<span class="tagchip">${escapeHtml(humanize(t))}</span>`).join('')}</div>` : ''}

    <div class="detail-body">
      <div class="ing-col">
        <div class="eyebrow">Ingredients</div>
        ${ingGroupsHtml}
      </div>
      <div class="steps-col">
        <div class="eyebrow">Steps</div>
        ${stepsHtml}
      </div>
    </div>

    ${(equipHtml || notesHtml) ? `<div class="detail-footer">${equipHtml}${notesHtml}</div>` : ''}
  `;

  document.getElementById('backBtn').addEventListener('click', closeDetail);
  document.getElementById('detailFavBtn').addEventListener('click', (e) => {
    toggleFavorite(r.id);
    e.currentTarget.classList.toggle('active');
    e.currentTarget.classList.add('bump');
    setTimeout(()=>e.currentTarget.classList.remove('bump'), 400);
  });

  // bidirectional ingredient <-> step highlighting
  function setActive(ingId, on){
    container.querySelectorAll(`[data-ing="${ingId}"]`).forEach(el => el.classList.toggle('active', on));
  }
  container.querySelectorAll('.ing-row.linked').forEach(row => {
    const id = row.dataset.ing;
    row.addEventListener('mouseenter', () => setActive(id, true));
    row.addEventListener('mouseleave', () => setActive(id, false));
    row.addEventListener('click', () => {
      const willActivate = state.activeIngredientId !== id;
      if(state.activeIngredientId) setActive(state.activeIngredientId, false);
      state.activeIngredientId = willActivate ? id : null;
      if(willActivate) setActive(id, true);
    });
  });
  container.querySelectorAll('.ing-hl').forEach(span => {
    const id = span.dataset.ing;
    span.addEventListener('mouseenter', () => setActive(id, true));
    span.addEventListener('mouseleave', () => setActive(id, false));
    span.addEventListener('click', () => {
      document.querySelector(`.ing-row[data-ing="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  initTheme();
  try{
    const res = await fetch('recipes.json');
    const raw = await res.json();
    RECIPES = raw.map(normalizeRecipe);
  }catch(e){
    document.getElementById('resultsGrid').innerHTML = `<p style="color:var(--text-muted)">Couldn't load recipes.json — make sure it's in the same folder as this page and you're viewing it over a local/web server (not file://).</p>`;
    console.error(e);
    return;
  }

  if(typeof Fuse !== 'undefined'){
    fuse = new Fuse(RECIPES, {
      includeScore:true,
      threshold:0.32,
      ignoreLocation:true,
      keys:[
        {name:'_title', weight:0.4},
        {name:'ingredients.name', weight:0.3},
        {name:'tags', weight:0.15},
        {name:'source.book', weight:0.1},
        {name:'source.author', weight:0.08},
        {name:'notes', weight:0.05},
      ]
    });
  }

  renderFacetButtons();
  renderFacetValues();
  renderActiveFilters();
  renderResults();
  renderRecent();
  renderFavToggleBtn();

  // search
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearSearch');
  input.addEventListener('input', () => {
    state.query = input.value;
    clearBtn.classList.toggle('show', input.value.length > 0);
    renderResults();
  });
  clearBtn.addEventListener('click', () => {
    input.value = ''; state.query=''; clearBtn.classList.remove('show'); input.focus(); renderResults();
  });

  // sort
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    state.sort = e.target.value;
    renderResults();
  });

  // favorites toggle
  document.getElementById('favToggleBtn').addEventListener('click', () => {
    state.showFavoritesOnly = !state.showFavoritesOnly;
    renderFavToggleBtn();
    renderActiveFilters();
    renderResults();
  });

  // theme
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  // logo -> home
  document.getElementById('logoBtn').addEventListener('click', () => {
    if(state.view === 'detail') closeDetail();
  });

  // keyboard: '/' focuses search
  document.addEventListener('keydown', (e) => {
    if(e.key === '/' && document.activeElement !== input && state.view === 'browse'){
      e.preventDefault(); input.focus();
    }
    if(e.key === 'Escape' && state.view === 'detail'){ closeDetail(); }
  });

  // deep link support
  function handleHash(){
    const m = location.hash.match(/^#recipe\/(.+)$/);
    if(m && RECIPES.find(r=>r.id===m[1])){ openDetail(m[1]); }
  }
  window.addEventListener('popstate', () => { if(!location.hash) closeDetail(); else handleHash(); });
  handleHash();
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
